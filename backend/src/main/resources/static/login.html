<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>머니로그 - 로그인</title>
</head>
<body>
  <h1>머니로그</h1>

  <h2>로그인</h2>
  <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="이메일" required />
    <input type="password" id="loginPassword" placeholder="비밀번호" required />
    <button type="submit">로그인</button>
  </form>
  <p id="loginMsg" style="color:red"></p>

  <h2>회원가입</h2>
  <form id="signupForm">
    <input type="email" id="signupEmail" placeholder="이메일" required />
    <input type="password" id="signupPassword" placeholder="비밀번호 (8자 이상)" required />
    <input type="text" id="signupNickname" placeholder="닉네임" required />
    <button type="submit">회원가입</button>
  </form>
  <p id="signupMsg" style="color:red"></p>

  <script src="api.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      try {
        const body = await apiFetch("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ email, password }),
        });
        localStorage.setItem("accessToken", body.data.accessToken);
        location.href = "transactions.html";
      } catch (err) {
        document.getElementById("loginMsg").textContent = err.message;
      }
    });

    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("signupEmail").value;
      const password = document.getElementById("signupPassword").value;
      const nickname = document.getElementById("signupNickname").value;
      try {
        await apiFetch("/api/auth/signup", {
          method: "POST",
          body: JSON.stringify({ email, password, nickname }),
        });
        document.getElementById("signupMsg").style.color = "green";
        document.getElementById("signupMsg").textContent = "회원가입 성공! 위에서 로그인해주세요.";
      } catch (err) {
        document.getElementById("signupMsg").style.color = "red";
        document.getElementById("signupMsg").textContent = err.message;
      }
    });
  </script>
</body>
</html>
