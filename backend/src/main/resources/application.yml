spring:
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  # 절대 소스코드에 하드코딩 금지! 실제 배포 시에는 환경변수(JWT_SECRET)로 주입한다.
  # 아래 기본값은 로컬 개발 전용이며, HS256 기준 최소 32바이트(base64 디코딩 후) 이상이어야 한다.
  secret: ${JWT_SECRET:ZGV2LW9ubHktY2hhbmdlLXRoaXMtc2VjcmV0LXBsZWFzZS0zMi1ieXRlcy1taW4=}
  expiration-ms: 3600000 # accessToken 1시간

---
# ===== 로컬 프로파일 (H2 인메모리) =====
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:moneylog;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    show-sql: true

---
# ===== 운영 프로파일 (MySQL 8) =====
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/moneylog
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 이 캡스톤 규모에는 별도 마이그레이션 도구(Flyway 등)가 없어 update로 스키마를 자동 생성한다.
      # 실무에서는 운영 DB에 validate/none + 마이그레이션 도구 사용을 권장한다.
      ddl-auto: update
    show-sql: false
